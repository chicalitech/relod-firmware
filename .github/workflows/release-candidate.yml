name: Publish firmware candidate

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'main or a vMAJOR.MINOR.PATCH tag already merged into main'
        required: true
        default: main
        type: string
      release_notes:
        description: 'Release changes and hardware scope (maximum 1024 characters)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-candidate
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'chicalitech/relod-firmware' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: candidate-${{ steps.source.outputs.commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_REF: ${{ inputs.release_ref }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve approved release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" == main ]]; then
            commit=$(git rev-parse 'refs/remotes/origin/main^{commit}')
          elif [[ "$RELEASE_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            commit=$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")
          else
            echo 'Only main or a canonical version tag is allowed' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          git checkout --detach "$commit"
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test release tooling and portable policy
        run: |
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          mkdir -p build
          c++ -std=c++17 -Wall -Wextra -Werror -I relod_sparkfun_v8_0/include relod_sparkfun_v8_0/tests/power_policy_test.cpp -o build/policy-test
          ./build/policy-test
      - name: Install pinned build and release tools
        run: python -m pip install platformio==6.1.19 -r requirements-release.txt
      - name: Build and package exact candidate
        shell: bash
        run: |
          set -euo pipefail
          platformio run -d relod_sparkfun_v8_0 -e sparkfun_c6
          printf '%s' "$RELEASE_NOTES" > build/release-notes.txt
          tag_args=()
          if [[ "$RELEASE_REF" != main ]]; then tag_args=(--tag "$RELEASE_REF"); fi
          python -B scripts/package_firmware.py --binary relod_sparkfun_v8_0/.pio/build/sparkfun_c6/firmware.bin --output build/release --release-notes-file build/release-notes.txt "${tag_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ env.RELEASE_COMMIT }}
          path: build/release/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: build
    if: github.repository == 'chicalitech/relod-firmware' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: firmware-candidates
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-release.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: build/release
      - name: Assume candidate publisher role
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.FIRMWARE_PUBLISH_ROLE_ARN }}
          aws-region: us-east-2
          allowed-account-ids: '734846754275'
      - name: Publish immutable candidate only
        run: python -B scripts/publish_firmware.py --bucket relod-firmware-updates --manifest build/release/manifest.json --binary build/release/firmware.bin
