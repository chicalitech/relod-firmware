name: Validate

on:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  platformio:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Test release tooling
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test portable C++17 policy
        run: |
          mkdir -p build
          c++ -std=c++17 -Wall -Wextra -Werror -I relod_sparkfun_v8_0/include relod_sparkfun_v8_0/tests/power_policy_test.cpp -o build/policy-test
          ./build/policy-test

      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Build production SparkFun firmware
        run: platformio run -d relod_sparkfun_v8_0 -e sparkfun_c6

      - name: Verify and package the OTA application
        run: python -B scripts/package_firmware.py --binary relod_sparkfun_v8_0/.pio/build/sparkfun_c6/firmware.bin --output build/release

      - name: Retain the exact validated bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sparkfun-c6-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30
