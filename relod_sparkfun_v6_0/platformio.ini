; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sparkfun_c6
src_dir = src/relod_sparkfun_v6_0

; --- Shared settings for every environment below ---
[env]
; Pinned pioarduino release supplies Arduino-ESP32 3.3.11 for these C6 boards.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    adafruit/Adafruit BusIO @ 1.17.4
    https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58
    https://github.com/sparkfun/SparkFun_VL53L5CX_Arduino_Library.git#248607060e49d18bdf064c6aa411ffe515993d16
    https://github.com/adafruit/Adafruit_Si7021.git#223a4b93942404bdf68ea8c107e86a1dc5d3c379
    https://github.com/adafruit/Adafruit_Sensor.git#0a9127a1e886ff1adb4c1b6f5958b24108d55aa6
    https://github.com/sparkfun/SparkFun_BMA400_Arduino_Library.git#85e644b5868c807b1df6ff8f1a125708e0eb947e
    https://github.com/sparkfun/SparkFun_MAX1704x_Fuel_Gauge_Arduino_Library.git#6ea1765a513dde65e433dde12a70fced73b65fed

; --- SparkFun Thing Plus - ESP32-C6 ---
[env:sparkfun_c6]
board = sparkfun_esp32c6_thing_plus
; Two 6.25 MiB OTA app slots on the 16 MiB SparkFun board.
board_build.partitions = default_16MB.csv

; --- Seeed Studio XIAO ESP32-C6 ---
[env:xiao_c6]
board = seeed_xiao_esp32c6
; Two 1.875 MiB OTA app slots on the 4 MiB XIAO board.
board_build.partitions = min_spiffs.csv

; Development builds retain symbols and enable Arduino informational logs.
[env:sparkfun_c6_debug]
extends = env:sparkfun_c6
build_type = debug
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:xiao_c6_debug]
extends = env:xiao_c6
build_type = debug
build_flags =
    -DCORE_DEBUG_LEVEL=3
