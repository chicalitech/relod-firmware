;
; Hello World Test - PlatformIO Configuration
;
; This configuration validates the development environment for XIAO ESP32C6
; using the pioarduino platform.
;
; Usage:
;   Build:   pio run -c hello_world_test/platformio.ini
;   Upload:  pio run -c hello_world_test/platformio.ini --target upload
;   Monitor: pio device monitor -b 115200
;
; Related: Issue #6 - Development environment validation
;

[platformio]
default_envs = xiao_c6_hello_world

[env:xiao_c6_hello_world]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

; Serial monitor configuration
monitor_speed = 115200

; Required build flags for XIAO ESP32C6
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
