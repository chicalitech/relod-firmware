; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sparkfun_c6
; A short core path avoids Windows' legacy 260-character path limit while
; installing the ESP32 Arduino framework.
core_dir = C:/pio

; --- Shared settings for every environment below ---
[env]
; The official PlatformIO "espressif32" platform lags behind on ESP32-C6
; support (missing board defs, Arduino-core validation errors). The
; pioarduino fork tracks the latest Arduino-ESP32 core and is the
; community-recommended replacement for C6/C5/H2/P4 boards.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
build_src_filter =
    +<main.cpp>
    -<minimal_test.cpp>
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson @ ^7
    https://github.com/tzapu/WiFiManager.git
    https://github.com/sparkfun/SparkFun_VL53L5CX_Arduino_Library.git
    https://github.com/adafruit/Adafruit_Si7021.git
    https://github.com/adafruit/Adafruit_Sensor.git
    https://github.com/sparkfun/SparkFun_BMA400_Arduino_Library.git
    https://github.com/sparkfun/SparkFun_MAX1704x_Fuel_Gauge_Arduino_Library.git
    adafruit/Adafruit EPD @ ^4.6.11

; --- SparkFun Thing Plus - ESP32-C6 ---
[env:sparkfun_c6]
board = sparkfun_esp32c6_thing_plus
board_build.partitions = default_16MB.csv

; Temporary diagnostic build for the currently soldered BUSY=IO9 connection.
; Use sparkfun_c6 after moving BUSY to IO18.
[env:sparkfun_c6_soldered_test]
extends = env:sparkfun_c6
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DEPD_BUSY_PIN=9

; Minimal USB/WiFi isolation test. It does not touch sensors or the e-ink.
[env:sparkfun_c6_minimal_test]
extends = env:sparkfun_c6
upload_speed = 460800
build_src_filter =
    -<*>
    +<minimal_test.cpp>
