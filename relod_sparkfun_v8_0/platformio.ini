[platformio]
default_envs = sparkfun_c6
core_dir = C:/pio

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLID_CLOSED_X=0.0f
    -DLID_CLOSED_Y=0.0f
    -DLID_CLOSED_Z=1.0f
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit EPD @ 4.6.13
    https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58
    https://github.com/sparkfun/SparkFun_VL53L5CX_Arduino_Library.git#248607060e49d18bdf064c6aa411ffe515993d16
    https://github.com/adafruit/Adafruit_Si7021.git#223a4b93942404bdf68ea8c107e86a1dc5d3c379
    https://github.com/adafruit/Adafruit_Sensor.git#0a9127a1e886ff1adb4c1b6f5958b24108d55aa6
    https://github.com/sparkfun/SparkFun_BMA400_Arduino_Library.git#85e644b5868c807b1df6ff8f1a125708e0eb947e
    https://github.com/sparkfun/SparkFun_MAX1704x_Fuel_Gauge_Arduino_Library.git#6ea1765a513dde65e433dde12a70fced73b65fed

[env:sparkfun_c6]
board = sparkfun_esp32c6_thing_plus
board_build.partitions = default_16MB.csv

[env:sparkfun_c6_debug]
extends = env:sparkfun_c6
build_flags =
    ${env.build_flags}
    -DRELOD_DEBUG=1
build_type = debug

; Temporary wiring only. GPIO9 is a boot strap; production uses BUSY=GPIO18.
[env:sparkfun_c6_soldered_test]
extends = env:sparkfun_c6
build_flags =
    ${env.build_flags}
    -DEPD_BUSY_PIN=9
